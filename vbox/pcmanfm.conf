# testproject-vbox: desktop background of LXDE (pcmanfm --desktop --profile LXDE)
# copied from /etc/skel to ~/.config/pcmanfm/LXDE/ when the user molior is created
[desktop]
wallpaper_mode=crop
wallpaper=/usr/share/testproject/background.jpg
desktop_bg=#000000
desktop_fg=#ffffff
desktop_shadow=#000000
show_wm_menu=0
