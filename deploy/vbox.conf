# vim: syntax=sh

DEPLOYMENT_TYPE=vbox
ARCH=amd64
INSTALL_PACKAGE=${PACKAGE_NAME}-vbox
TARGET_HOSTNAME=$PROJECT-vm

VMSIZE=32768 # MB
VMRAM=2048
VMVRAM=128

SFDISK="unit: sectors
swap: Id=82, size=512M, start=2048
root: Id=83, size=5G, bootable
/opt: Id=83"

PART1_FS=swap
PART2_FS=ext4
PART3_FS=ext4
ROOTPART=2
PART3_MNT=/opt
